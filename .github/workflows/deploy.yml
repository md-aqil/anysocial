name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no aqil@187.127.154.55 << 'EOF'
            cd /var/www/socialsched
            echo "aqil@noon" | sudo -S git fetch origin
            echo "aqil@noon" | sudo -S git reset --hard origin/main
            echo "aqil@noon" | sudo -S bash deploy/deploy.sh
          EOF
