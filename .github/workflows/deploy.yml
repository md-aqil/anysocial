name: Deploy to VPS

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/socialsched
            
            # Use sudo with a password injected via a GitHub secret (VPS_PASSWORD)
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git config --global --add safe.directory /var/www/socialsched
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git fetch origin
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git reset --hard origin/main
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git clean -fd --force
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x deploy/deploy.sh
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S bash deploy/deploy.sh
